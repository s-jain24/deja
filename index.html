V.missing = (msg, back) => `
<section class="screen has-nav"><div class="glow mid soft"></div>${topbar()}
  <div class="empty"><h1 id="h" tabindex="-1" style="margin:0;font-weight:400"><span class="l1">Nothing to</span><br><em class="s l2">see</em></h1><p class="lede">${esc(msg)}</p>
  <div class="cta-stack" style="max-width:300px"><a class="btn btn-primary" href="#/${back}">Go back</a></div></div>${nav(back)}</section>`;
/* =====================================================================
   Controller: routing, actions, uploads, matching, saving
   ===================================================================== */
const Unsaved = new Map();       // looks un-saved from their own detail view stay visible
let curPath = null, prevPath = null, doneTimer = null, refreshT = null;

function render() {
  const [r, a, b] = route();
  const path = route().join("/");
  if (path !== curPath) clearTimeout(doneTimer);
  let html;
  switch (r) {
    case "": case "welcome":
      if (r === "" && State.onboarded) return location.replace("#/wardrobe");
      html = V.welcome(); break;
    case "upload": html = V.upload("onboard"); break;
    case "add":
      if (isDemo()) return location.replace("#/wardrobe");
      html = V.upload("add"); break;
    case "review":
      if (!State.uploads.length) return location.replace(a === "add" ? "#/add" : "#/upload");
      html = V.review(a); break;
    case "done": html = V.done(); if (path !== curPath) doneTimer = setTimeout(() => route()[0] === "done" && go("wardrobe"), 2600); break;
    case "wardrobe": html = V.wardrobe(); break;
    case "outfit": html = V.outfit(a); break;
    case "style": html = V.style(); break;
    case "thinking": if (!Job) return location.replace("#/style"); html = V.thinking(); break;
    case "matches": if (!State.result[State.space]) return location.replace("#/style"); html = V.matches(); break;
    case "look": html = V.look(a, b); break;
    case "saved": html = V.saved(); break;
    default: return location.replace("#/wardrobe");
  }
  const same = path === curPath, y = window.scrollY;
  if (!same) { prevPath = curPath; curPath = path; }
  $("#app").innerHTML = html;
  if (same) window.scrollTo(0, y);
  else { window.scrollTo(0, 0); $("#h")?.focus({ preventScroll: true }); }
  bindDrops();
}
function refresh() {
  clearTimeout(refreshT);
  refreshT = setTimeout(() => {
    const ae = document.activeElement;
    if (ae && ae.tagName === "INPUT" && $("#app").contains(ae)) return;   // never clobber typing
    if ($("#dlg").open) return;
    render();
  }, 60);
}

/* ---------- Uploads ---------- */
function pickFiles(multi) { const el = $(multi ? "#file-multi" : "#file-one"); el.value = ""; el.click(); }
async function handleFiles(list) {
  const files = [...list]; if (!files.length) return;
  if (isDemo()) { setSpace("mine"); }
  if (!State.batch) { State.batch = uid("b"); DB.kvSet("batch", State.batch).catch(() => {}); }
  const fresh = files.map(f => ({ key: uid("u"), file: f, name: f.name || "photo", status: "processing" }));
  State.uploads.push(...fresh);
  const r = route()[0];
  if (r === "upload") go("review"); else if (r === "add") go("review/add"); else render();
  for (const u of fresh) await processUpload(u);
}
async function processUpload(u) {
  u.status = "processing"; u.error = ""; refresh();
  try {
    const { blob, w, h } = await compress(u.file);
    const o = { id: uid("o"), space: "mine", name: `Outfit ${State.mine.length + 1}`, nameEdited: false, tags: [], tagsEdited: false,
      blob, w, h, createdAt: Date.now(), analysis: null, analysisStatus: "none", analysisError: "", batch: State.batch };
    await saveOutfit(o);
    if (!State.uploads.includes(u)) { await DB.del("outfits", o.id); return; }   // removed while preparing
    State.mine.unshift(o);
    Object.assign(u, { status: "ready", outfitId: o.id, preview: blobUrl(o.id, blob) });
  } catch (e) {
    u.status = "error";
    u.retryable = !(e instanceof UploadError && (e.code === "type" || e.code === "size"));
    u.error = e instanceof UploadError ? e.message : e?.name === "QuotaExceededError" ? "Storage is full on this device" : "Couldn't save this photo";
  }
  refresh();
}
async function removeUpload(key) {
  const u = State.uploads.find(x => x.key === key); if (!u) return;
  State.uploads = State.uploads.filter(x => x !== u);
  if (u.outfitId) await deleteOutfitData(u.outfitId);
  if (!State.uploads.length) { const add = route()[1] === "add"; go(add ? "add" : "upload"); } else render();
}
function rebuildBatch() {
  if (!State.batch) return;
  State.uploads = State.mine.filter(o => o.batch === State.batch).map(o => ({ key: uid("u"), name: o.name, status: "ready", outfitId: o.id, preview: blobUrl(o.id, o.blob) }));
}
async function finishUpload() {
  const add = route()[1] === "add";
  const ids = State.uploads.filter(u => u.status === "ready").map(u => u.outfitId);
  const list = State.mine.filter(o => ids.includes(o.id));
  list.forEach(o => { delete o.batch; saveOutfit(o).catch(() => {}); });
  State.uploads = []; State.batch = null; DB.kvDel("batch").catch(() => {});
  setSpace("mine"); setOnboarded();
  Queue.add(list);
  if (add) { toast(`Added ${list.length} outfit${list.length > 1 ? "s" : ""}`); location.replace("#/wardrobe"); }
  else location.replace("#/done");
}

/* ---------- Wardrobe edits ---------- */
function applyAnalysis(o, a) {
  if (!a.isOutfit) { o.analysisStatus = "not_outfit"; o.analysis = null; return; }
  o.analysis = a; o.analysisStatus = "done"; o.analysisError = "";
  if (!o.nameEdited && a.name) o.name = a.name;
  if (!o.tagsEdited && a.tags.length) o.tags = a.tags;
}
async function renameOutfit(id, name) {
  name = name.trim().replace(/\s+/g, " ").slice(0, 40);
  const o = findOutfit(id); if (!o) return;
  if (!name) { render(); return toast("A name can't be empty"); }
  if (name === o.name) return;
  if (isDemo()) { State.demo.names[id] = name; await saveDemo(); }
  else { const m = State.mine.find(x => x.id === id); m.name = name; m.nameEdited = true; await saveOutfit(m); }
  toast("Renamed");
}
async function setTags(id, tags) {
  if (isDemo()) { State.demo.tags[id] = tags; await saveDemo(); }
  else { const m = State.mine.find(x => x.id === id); m.tags = tags; m.tagsEdited = true; await saveOutfit(m); }
  render();
}
async function deleteOutfitData(id) {
  State.mine = State.mine.filter(o => o.id !== id);
  dropUrl(id);
  await DB.del("outfits", id).catch(() => {});
}
async function deleteOutfit(id) {
  const o = findOutfit(id); if (!o) return;
  const looks = State.saved.filter(s => s.space === State.space && s.outfitId === id);
  const ok = await ask({ title: `Delete “${o.name}”?`, body: `${isDemo() ? "It will be hidden from the sample wardrobe until you reset the demo." : "The photo is removed from this device."}${looks.length ? ` ${looks.length} saved look${looks.length > 1 ? "s" : ""} using it will be removed too.` : ""}`, ok: "Delete", danger: true });
  if (!ok) return;
  if (isDemo()) { State.demo.deleted.push(id); await saveDemo(); } else await deleteOutfitData(id);
  for (const s of looks) await unsaveRecord(s);
  toast("Outfit deleted");
  location.replace("#/wardrobe");
}

/* ---------- Demo ---------- */
function enterDemo() { setSpace("demo"); setOnboarded(); State.uploads = []; toast("Sample wardrobe loaded"); go("wardrobe"); }
async function resetDemo() {
  const ok = await ask({ title: "Reset the demo?", body: "Sample outfits, names, tags, saved demo looks and demo results go back to the start. Your own wardrobe isn't touched.", ok: "Reset demo" });
  if (!ok) return;
  State.demo = { deleted: [], names: {}, tags: {} }; await saveDemo();
  for (const s of State.saved.filter(s => s.space === "demo")) await unsaveRecord(s);
  const old = [State.draft.demo?.ref?.id, State.result.demo?.insp?.id];
  State.draft.demo = null; State.result.demo = null;
  await DB.kvDel("draft:demo").catch(() => {}); await DB.kvDel("result:demo").catch(() => {});
  for (const id of old) await gcInspiration(id);
  setSpace("demo");
  toast("Demo reset"); go("wardrobe");
}

/* ---------- Inspiration ---------- */
async function handleInsp(file) {
  if (!file) return;
  try {
    toast("Preparing image…", false);
    const { blob } = await compress(file, 1600);
    const rec = { id: uid("i"), blob, createdAt: Date.now() };
    await DB.put("inspirations", rec); State.insp.set(rec.id, rec);
    const d = State.draft[State.space] || {}, old = d.ref;
    await setDraft({ ...d, ref: { kind: "upload", id: rec.id } });
    if (old?.kind === "upload") await gcInspiration(old.id);
    toast("Inspiration added"); render();
  } catch (e) { toast(e instanceof UploadError ? e.message : "Couldn't use that image — try a JPG or PNG"); }
}

/* ---------- Matching ---------- */
async function saveNote(id, text) {
  const o = State.mine.find(x => x.id === id); if (!o) return;
  const v = text.trim().slice(0, 300);
  if (v === (o.note || "")) return;
  o.note = v; await saveOutfit(o).catch(() => {});
  toast(v ? "Description saved" : "Description cleared"); refresh();
}
async function runFindNotes(d, occasion) {
  const text = (d.text || "").trim();
  if (text.length < 3) return toast("Describe the look you want first");
  const list = outfits().filter(o => o.space === "demo" || o.note || (o.analysis && o.analysisStatus === "done"));
  if (!list.length) return toast("Add a description to at least one outfit first");
  const ctl = new AbortController();
  Job = { ctl, step: 1, total: list.length, analysing: 0, notes: true };
  go("thinking");
  try {
    const res = await AI.matchText(text, list, occasion, ctl.signal);
    if (ctl.signal.aborted) throw { code: "cancelled" };
    await setResult({ insp: d.ref || null, text, occasion, mode: "notes", demo: false, isOutfit: true,
      summary: res.summary || text, note: res.note, matches: res.matches, wardrobeSize: list.length, at: Date.now() });
    Job = null; location.replace("#/matches");
  } catch (e) {
    Job = null; location.replace("#/style");
    toast(e?.code === "cancelled" ? "Stopped" : (e?.message || "Something went wrong — try again"));
  }
}
async function runFindLocal(d, occasion) {
  const text = (d.text || "").trim();
  if (text.length < 3) return toast("Describe the look you want first");
  const list = outfits().filter(o => o.space === "demo" || o.note || (o.tags || []).length || (o.analysis && o.analysisStatus === "done"));
  if (!list.length) return toast("Add a description to at least one outfit first");
  let res;
  try { res = Local.match(text, list, occasion); } catch (e) { return toast(e.message); }
  await setResult({ insp: d.ref || null, text, occasion, mode: "local", demo: false, isOutfit: true,
    summary: res.summary, note: res.note, matches: res.matches, wardrobeSize: list.length, at: Date.now() });
  go("matches");
}
async function runFind() {
  const d = State.draft[State.space] || {};
  const occasion = d.occasion || "";
  if (!(isDemo() && d.ref?.kind === "sample")) {
    if (AI.status === "text") return runFindNotes(d, occasion);
    if (AI.status === "unavailable") return runFindLocal(d, occasion);
  }
  if (!d.ref) return;
  if (isDemo() && d.ref.kind === "sample") {
    const s = DEMO.inspirations.find(x => x.id === d.ref.id);
    const pre = (DEMO.matches[d.ref.id] || []).filter(m => findOutfit(m.id)).map(m => ({ ...m }));
    await setResult({ insp: d.ref, occasion, demo: true, mode: "demo", isOutfit: true, summary: s.summary, note: "", matches: pre, wardrobeSize: outfits().length, at: Date.now() });
    return go("matches");
  }
  if (AI.status !== "ready") return toast(AI.status === "checking" ? "Still checking live matching — try again in a moment" : "Live matching isn't available here");
  const ctl = new AbortController();
  const toRead = isDemo() ? [] : State.mine.filter(o => ["none","failed"].includes(o.analysisStatus));
  Job = { ctl, step: toRead.length ? 0 : 1, total: outfits().filter(o => o.analysisStatus !== "not_outfit").length, analysing: toRead.length };
  go("thinking");
  const upd = () => route()[0] === "thinking" && render();
  try {
    while (Queue.busy) { if (ctl.signal.aborted) throw { code: "cancelled" }; await sleep(300); }
    for (const o of toRead) {
      if (ctl.signal.aborted) throw { code: "cancelled" };
      if (!["none","failed"].includes(o.analysisStatus)) continue;
      o.analysisStatus = "pending";
      try { applyAnalysis(o, await AI.analyzeOutfit(o.blob)); }
      catch (e) { o.analysisStatus = e.code === "not_granted" ? "none" : "failed"; o.analysisError = e.message; if (AI.status !== "ready") throw e; }
      await saveOutfit(o).catch(() => {});
    }
    if (ctl.signal.aborted) throw { code: "cancelled" };
    const ready = outfits().filter(o => o.analysisStatus === "done");
    if (!ready.length) throw new Error("None of your outfit photos could be read yet, so there's nothing to match. Open an outfit to try again.");
    Job.step = 1; Job.total = ready.length; upd();
    const blob = d.ref.kind === "sample" ? dataUrlToBlob(inspImg(d.ref)) : State.insp.get(d.ref.id)?.blob;
    if (!blob) throw new Error("The inspiration image is missing — add it again.");
    const res = await AI.match(blob, ready, occasion, ctl.signal);
    if (ctl.signal.aborted) throw { code: "cancelled" };
    Job.step = 2; upd();
    const prev = State.result[State.space]?.insp?.id;
    await setResult({ insp: d.ref, occasion, demo: false, mode: "live", isOutfit: res.isOutfit, summary: res.summary, note: res.note, matches: res.matches, wardrobeSize: ready.length, at: Date.now() });
    if (prev && prev !== d.ref.id) gcInspiration(prev);
    Job = null; location.replace("#/matches");
  } catch (e) {
    Job = null;
    location.replace("#/style");
    if (e?.code !== "cancelled") toast(e?.message || "Something went wrong — try again"); else toast("Stopped");
  }
}

/* ---------- Saving looks ---------- */
function isSaved(L) {
  const sp = L.space || State.space;
  return State.saved.find(s => s.space === sp && s.outfitId === L.id && s.insp?.kind === L.insp?.kind && s.insp?.id === L.insp?.id
    && (s.insp ? true : (s.text || "") === (L.text || "")));
}
async function unsaveRecord(s) {
  State.saved = State.saved.filter(x => x !== s);
  await DB.del("saved", s.id).catch(() => {});
  if (s.insp?.kind === "upload") await gcInspiration(s.insp.id);
}
async function toggleSave(L) {
  const ex = isSaved(L);
  if (ex) { Unsaved.set(ex.id, ex); await unsaveRecord(ex); toast("Removed from saved"); }
  else {
    const rec = { id: uid("s"), space: L.space || State.space, outfitId: L.id, insp: L.insp || null, score: L.score, why: L.why, tip: L.tip,
      demo: !!L.demo, mode: L.mode || (L.demo ? "demo" : "live"), text: L.text || "", occasion: L.occasion || "", summary: L.summary || "", savedAt: Date.now() };
    try { await DB.put("saved", rec); } catch { return toast("Couldn't save — storage is blocked"); }
    State.saved.unshift(rec); toast("Saved to your looks");
  }
  render();
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "start": setSpace("mine"); State.uploads = []; State.batch = null; go("upload"); break;
    case "demo": enterDemo(); break;
    case "skip": setSpace("mine"); setOnboarded(); go("wardrobe"); break;
    case "pick": pickFiles(true); break;
    case "rm-up": removeUpload(el.dataset.k); break;
    case "retry-up": { const u = State.uploads.find(x => x.key === el.dataset.k); if (u?.file) processUpload(u); break; }
    case "confirm-upload": finishUpload(); break;
    case "to-wardrobe": go("wardrobe"); break;
    case "add":
      if (isDemo()) {
        const ok = await ask({ title: "Add your own outfits?", body: "The sample wardrobe stays as it is. Your photos go into your own wardrobe, kept separately on this device.", ok: "Switch to my wardrobe" });
        if (!ok) return;
        setSpace("mine");
      }
      State.uploads = []; State.batch = null; go("add"); break;
    case "open-outfit": go("outfit/" + id); break;
    case "back": {
      const r = route(), fallback = r[0] === "outfit" ? "wardrobe" : r[1] === "s" ? "saved" : "matches";
      const target = prevPath && prevPath !== curPath && !["thinking","review","done","upload"].includes(prevPath.split("/")[0]) ? prevPath : fallback;
      go(target); break;
    }
    case "reset-demo": resetDemo(); break;
    case "exit-demo": setSpace("mine"); toast("Switched to your wardrobe"); go("wardrobe"); break;
    case "analyse-all": Queue.add(State.mine); render(); break;
    case "analyse-one": { const o = State.mine.find(x => x.id === id); if (o) { Queue.add([o]); render(); } break; }
    case "rm-tag": { const o = findOutfit(id); if (o) setTags(id, o.tags.filter((_, i) => i !== +el.dataset.i)); break; }
    case "del-outfit": deleteOutfit(id); break;
    case "to-style": go("style"); break;
    case "pick-insp": pickFiles(false); break;
    case "clear-insp": { const d = State.draft[State.space] || {}; const old = d.ref; await setDraft({ ...d, ref: null }); if (old?.kind === "upload") await gcInspiration(old.id); render(); break; }
    case "pick-sample": {
      const d = State.draft[State.space] || {}, old = d.ref;
      const sample = DEMO.inspirations.find(x => x.id === id);
      const next = { ...d, ref: { kind: "sample", id } };
      if (["text","unavailable"].includes(AI.status) && !(d.text || "").trim() && sample) next.text = sample.summary;   // the sample's own written summary
      await setDraft(next);
      if (old?.kind === "upload") await gcInspiration(old.id);
      render(); break;
    }
    case "occ": { const d = State.draft[State.space] || {}; await setDraft({ ...d, occasion: d.occasion === el.dataset.v ? "" : el.dataset.v }); render(); break; }
    case "find": runFind(); break;
    case "stop": Job?.ctl.abort(); break;
    case "view-match": go("look/m/" + el.dataset.i); break;
    case "toggle-save": { const r = State.result[State.space]; const m = r?.matches[+el.dataset.i]; if (m) toggleSave({ ...m, insp: r.insp, demo: r.demo, mode: modeOf(r), text: r.text, occasion: r.occasion, summary: r.summary }); break; }
    case "toggle-save-look": { const L = lookFrom(el.dataset.kind, el.dataset.key); if (L) toggleSave(L); break; }
    case "another": { const d = State.draft[State.space] || {}; await setDraft({ ...d, ref: null }); go("style"); break; }
    case "open-saved": go("look/s/" + id); break;
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form='add-tag']"); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector("input"), v = inp.value.trim().replace(/\s+/g, " ").slice(0, 22), o = findOutfit(f.dataset.id);
  if (!v || !o) return;
  if (o.tags.some(t => t.toLowerCase() === v.toLowerCase())) { inp.value = ""; return toast("That tag is already there"); }
  if (o.tags.length >= 8) return toast("Up to 8 tags per outfit");
  inp.value = "";
  setTags(o.id, [...o.tags, v]).then(() => $("#tag-in")?.focus());
});
document.addEventListener("input", e => {
  if (e.target.id !== "insp-text") return;
  const d = State.draft[State.space] || {}; d.text = e.target.value; State.draft[State.space] = d;
  const btn = $("button[data-act='find']");
  if (btn) btn.disabled = btn.dataset.block === "1" || e.target.value.trim().length < 3;
});
document.addEventListener("change", e => {
  if (e.target.id === "o-name") renameOutfit(e.target.dataset.id, e.target.value);
  if (e.target.id === "o-note") saveNote(e.target.dataset.id, e.target.value);
  if (e.target.id === "insp-text") setDraft({ ...(State.draft[State.space] || {}), text: e.target.value });
  if (e.target.id === "file-multi") handleFiles(e.target.files);
  if (e.target.id === "file-one") handleInsp(e.target.files[0]);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "o-name") { e.preventDefault(); e.target.blur(); } });
function bindDrops() {
  [["#dropzone", f => handleFiles(f)], ["#insp-drop", f => handleInsp(f[0])]].forEach(([sel, fn]) => {
    const z = $(sel); if (!z) return;
    z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", e => { e.preventDefault(); z.classList.remove("over"); if (e.dataTransfer?.files?.length) fn(e.dataTransfer.files); });
  });
}

/* ---------- Boot ---------- */
(async () => {
  await loadState();
  State.mine.forEach(o => { o.queued = false; });
  rebuildBatch();
  AI.on(() => { refresh(); Queue.run(); });
  AI.init();
  window.addEventListener("hashchange", render);
  render();
  if (!State.persistent) setTimeout(() => toast("Storage is blocked here — photos last only until you close this page", true), 800);
})();
</script>
