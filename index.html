<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Déjà — New inspiration. Already yours.</title>
<meta name="description" content="Upload the outfits you own, add an inspiration, and Deja finds that look in your own wardrobe.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="Déjà"><meta property="og:description" content="New inspiration. Already yours.">
<meta property="og:image" content="/icon-512.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/playfair-display-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<style>
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/dm-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Playfair Display";font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/playfair-display-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Playfair Display";font-style:italic;font-weight:500;font-display:swap;src:url(/fonts/playfair-display-latin-500-italic.woff2) format("woff2")}

/* ---------- Tokens (from the Déjà Figma frames) ---------- */
:root{
  color-scheme: light;
  --ink:#171618;          /* pill buttons, check, wordmark */
  --text:#1E1D20;
  --muted:#6B6670;
  --faint:#9A95A0;
  --track:#ECEAEE;        /* progress track, dividers */
  --card:#FFFFFF;
  --ground:#FFFFFF;
  --tint:#F7F4F7;         /* quiet fills */
  --rose:#D8649A;         /* glow core */
  --blush:#EFA6C8;
  --lilac:#B6A3DD;
  --crimson:#B01A45;      /* from frame 1 splash, used for "saved" only */
  --ok:#2E6F4F;
  --warn:#9A5A14;
  --danger:#A8261F;
  --serif:"Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"DM Sans", "Helvetica Neue", Helvetica, system-ui, sans-serif;
  --r-card:14px;
  --r-tile:12px;
  --pill:999px;
  --pad:24px;
  --shadow-card:0 1px 2px rgba(40,20,45,.06), 0 8px 24px rgba(60,25,60,.08);
  --col:460px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
em.s, .serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.005em}

/* ---------- App column ---------- */
.app{max-width:var(--col);margin:0 auto;min-height:100%;position:relative;background:var(--ground);isolation:isolate}
@media (min-width:640px){
  body{background:#F3EFF3}
  .app{box-shadow:0 0 0 1px rgba(30,10,30,.05),0 30px 80px rgba(60,20,60,.10)}
}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;padding:0 var(--pad);padding-block:max(20px, env(safe-area-inset-top,0px)) 32px}
.screen.has-nav{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* ---------- The Déjà glow (soft blurred mesh from the frames) ---------- */
.glow{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glow::before,.glow::after{content:"";position:absolute;border-radius:50%;filter:blur(38px)}
.glow::before{width:95%;height:34%;left:22%;top:var(--gy,56%);background:radial-gradient(closest-side,rgba(216,100,154,.62),rgba(232,150,190,.35) 55%,rgba(255,255,255,0));}
.glow::after{width:70%;height:30%;left:-22%;top:calc(var(--gy,56%) - 4%);background:radial-gradient(closest-side,rgba(170,148,220,.55),rgba(190,175,230,.25) 60%,rgba(255,255,255,0));}
.glow.low{--gy:62%}
.glow.hero{--gy:50%}.glow.hero::before{height:40%}
.glow.mid{--gy:40%}
.glow.top{--gy:-8%}
.glow.soft::before{opacity:.55}.glow.soft::after{opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .glow.breathe::before{animation:drift 7s ease-in-out infinite alternate}
  .glow.breathe::after{animation:drift2 8s ease-in-out infinite alternate}
}
@keyframes drift{to{transform:translate(-14%,6%) scale(1.12)}}
@keyframes drift2{to{transform:translate(22%,-8%) scale(1.15)}}

/* ---------- Type ---------- */
.wordmark{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink);letter-spacing:-.01em;line-height:1}
.h-display{font-size:22px;line-height:1.36;font-weight:400;text-align:center;text-wrap:balance;margin:0}
.h-display em.s{font-size:1.08em}
.h-page{font-size:26px;line-height:1.2;font-weight:400;margin:0;text-wrap:balance}
.h-page em.s{font-size:1.12em}
.lede{color:var(--muted);font-size:15px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.small{font-size:13px;color:var(--muted)}

/* ---------- Buttons ---------- */
.btn{appearance:none;border:0;border-radius:var(--pill);min-height:52px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:500;letter-spacing:.005em;transition:transform .15s ease, background .15s ease, opacity .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--ink);color:#fff;width:100%}
.btn-primary:hover{background:#000}
.btn-primary[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn-light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(23,22,24,.14)}
.btn-light:hover{box-shadow:inset 0 0 0 1px rgba(23,22,24,.4)}
.btn-sm{min-height:40px;font-size:14px;padding:0 16px}
.link{appearance:none;background:none;border:0;padding:10px 8px;min-height:44px;font-size:14px;color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(30,29,32,.3)}
.link:hover{text-decoration-color:currentColor}
.link.quiet{text-decoration:none;color:var(--muted)}
.icon-btn{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:rgba(23,22,24,.06)}
.icon-btn svg,.btn svg{width:22px;height:22px}
.cta-stack{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.onb .cta-stack .btn-primary,.onb > .btn-primary{max-width:310px;align-self:center}

/* ---------- Progress (frame 3–5 top bar) ---------- */
.progress{height:3px;border-radius:3px;background:var(--track);margin:14px 24px 0;position:relative;overflow:hidden}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:3px;transition:width .5s ease}

/* ---------- Top bar in app ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;margin-bottom:8px}
.topbar .wordmark{font-size:28px}
.topbar .left{display:flex;align-items:center;gap:2px;margin-left:-10px}
.space-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;padding:6px 10px 6px 8px;border-radius:var(--pill);background:#fff;box-shadow:inset 0 0 0 1px rgba(23,22,24,.12);color:var(--ink)}
.space-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--rose)}

/* ---------- Photo card (collage + tiles) ---------- */
.photo{position:relative;border-radius:var(--r-tile);overflow:hidden;background:var(--tint);aspect-ratio:3/4;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.polaroid{background:#fff;border-radius:10px;padding:6px;box-shadow:var(--shadow-card)}
.polaroid .photo{border-radius:6px}

/* ---------- Welcome collage ---------- */
.collage{position:relative;height:170px;overflow:hidden;margin:28px calc(var(--pad) * -1) 0;display:flex;justify-content:center;align-items:center}
.collage .polaroid{position:absolute;width:96px}
.collage .polaroid:nth-child(1){transform:translateX(-196px) rotate(-8deg) scale(.92)}
.collage .polaroid:nth-child(2){transform:translateX(-100px) rotate(-4deg)}
.collage .polaroid:nth-child(3){transform:translateY(-6px) scale(1.04);z-index:2}
.collage .polaroid:nth-child(4){transform:translateX(104px) rotate(5deg)}
.collage .polaroid:nth-child(5){transform:translateX(200px) rotate(9deg) scale(.92)}
@media (prefers-reduced-motion:no-preference){
  .collage .polaroid{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .collage .polaroid:nth-child(2){animation-delay:.06s}.collage .polaroid:nth-child(3){animation-delay:.12s}
  .collage .polaroid:nth-child(4){animation-delay:.18s}.collage .polaroid:nth-child(5){animation-delay:.24s}
}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}

.how{list-style:none;padding:0;margin:22px auto 0;display:grid;gap:10px;max-width:300px}
.how li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;color:var(--text);line-height:1.4}
.how b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:17px;line-height:1.1;color:var(--ink);text-align:center}

/* ---------- Onboarding upload target ---------- */
.drop{appearance:none;border:0;background:transparent;width:100%;flex:1;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:24px;color:var(--ink)}
.drop svg{width:46px;height:46px}
.drop.over{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px var(--ink)}
.drop .small{max-width:240px;text-align:center}

/* ---------- Review grid (frame 4) ---------- */
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.tile{position:relative}
.tile .photo{border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.tile .state{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.72);backdrop-filter:blur(2px);text-align:center;padding:8px;font-size:12px;color:var(--text)}
.tile .state.err{background:rgba(255,246,246,.9);color:var(--danger)}
.tile .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tile .x svg{width:14px;height:14px}
.tile .x::after{content:"";position:absolute;inset:-8px}
.add-tile{appearance:none;border:0;background:transparent;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-size:12px;border-radius:10px}
.add-tile svg{width:30px;height:30px}
.add-tile:hover{background:rgba(255,255,255,.5)}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(23,22,24,.15);border-top-color:var(--ink);animation:spin .8s linear infinite;margin:0 auto 6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Done (frame 5) ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;cursor:pointer}
.done svg{width:40px;height:40px;margin-bottom:10px}
.done .l1{font-size:22px}
.done .l2{font-size:52px;line-height:.9;margin-top:2px}
@media (prefers-reduced-motion:no-preference){
  .done svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .15s ease forwards}
}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- Banners / notices ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.78);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;box-shadow:inset 0 0 0 1px rgba(23,22,24,.08)}
.notice svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.notice.warn{background:#FFF8EE;box-shadow:inset 0 0 0 1px rgba(154,90,20,.18)}
.notice.warn svg{color:var(--warn)}
.notice .actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.notice .link{padding:4px 0;min-height:32px;margin-right:12px}

/* ---------- Wardrobe ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.count{font-size:13px;color:var(--muted);white-space:nowrap;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.o-card{appearance:none;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.o-card .polaroid{transition:transform .2s ease, box-shadow .2s ease}
.o-card:hover .polaroid{transform:translateY(-2px);box-shadow:0 2px 4px rgba(40,20,45,.06),0 14px 30px rgba(60,25,60,.12)}
.o-card:nth-child(4n+1) .polaroid{rotate:-1deg}.o-card:nth-child(4n+2) .polaroid{rotate:1.2deg}
.o-card:nth-child(4n+3) .polaroid{rotate:.8deg}.o-card:nth-child(4n) .polaroid{rotate:-1.3deg}
.o-card .name{font-size:14.5px;font-weight:500;line-height:1.25;padding:0 2px;overflow-wrap:anywhere}
.o-card .meta{display:flex;flex-wrap:wrap;gap:4px;padding:0 2px}
.badge{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:var(--pill);background:rgba(255,255,255,.92);color:var(--text);display:inline-flex;gap:5px;align-items:center}
.badge .spinner{width:10px;height:10px;border-width:1.5px;margin:0}
.badge.err{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:6px 9px;border-radius:var(--pill);background:var(--tint);color:var(--text);white-space:nowrap}
.chip.quiet{background:transparent;box-shadow:inset 0 0 0 1px var(--track);color:var(--muted)}

.dock{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,var(--col));bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:14px var(--pad) 10px;background:linear-gradient(to top,rgba(255,255,255,.96) 55%,rgba(255,255,255,0));z-index:5}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--col));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--track);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;min-height:56px;color:var(--faint);text-decoration:none;font-size:12px;font-weight:500;border-radius:12px}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] span{position:relative}
.nav a[aria-current="page"] span::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--rose)}

/* ---------- Detail ---------- */
.back-row{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin:0 -10px 6px}
.detail-photo{width:100%;max-width:100%;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card);aspect-ratio:3/4;background:var(--tint)}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;min-height:48px;border-radius:12px;border:0;background:var(--tint);padding:0 14px;font-size:16px;box-shadow:inset 0 0 0 1px transparent}
.input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--ink);background:#fff}
textarea.input{min-height:98px;padding:12px 14px;line-height:1.5;resize:vertical;font-size:16px}
.name-input{font-size:22px;font-weight:500;background:transparent;padding:0 2px;min-height:44px;border-radius:8px}
.name-input:hover{background:var(--tint)}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:13px;padding:0 4px 0 12px;min-height:34px;border-radius:var(--pill);background:var(--tint)}
.tag button{appearance:none;border:0;background:transparent;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tag button:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.tag button svg{width:12px;height:12px}
.tag-add{display:flex;gap:8px;width:100%}
.tag-add .input{min-height:40px;font-size:15px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prose{font-size:15px;line-height:1.55;margin:0;color:var(--text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.danger{color:var(--danger)}
.btn-danger{background:#fff;color:var(--danger);box-shadow:inset 0 0 0 1px rgba(168,38,31,.28);width:100%}

/* ---------- Style me ---------- */
.insp-drop{appearance:none;border:0;width:100%;aspect-ratio:4/3;max-height:320px;border-radius:22px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1.5px rgba(23,22,24,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink);padding:18px;text-align:center}
.insp-drop:hover,.insp-drop.over{box-shadow:inset 0 0 0 1.5px var(--ink);background:rgba(255,255,255,.8)}
.insp-drop svg{width:40px;height:40px}
.insp-preview{position:relative;border-radius:22px;overflow:hidden;background:var(--tint);box-shadow:var(--shadow-card);max-height:420px;display:flex;justify-content:center}
.insp-preview img{max-height:420px;width:auto;max-width:100%;object-fit:contain}
.insp-preview .ovl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;justify-content:flex-end}
.pill-float{appearance:none;border:0;min-height:40px;padding:0 14px;border-radius:var(--pill);background:rgba(255,255,255,.94);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pill-float svg{width:16px;height:16px}
.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sample{appearance:none;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.sample .photo{border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sample[aria-pressed="true"] .photo{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.sample span{font-size:12.5px;line-height:1.25;color:var(--text)}
.occasions{display:flex;flex-wrap:wrap;gap:8px}
.occ{appearance:none;border:0;min-height:40px;padding:0 16px;border-radius:var(--pill);background:#fff;box-shadow:inset 0 0 0 1px rgba(23,22,24,.16);font-size:14px;font-weight:500}
.occ[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.section-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.live-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.live-status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.live-status.on i{background:#3E9B6A;box-shadow:0 0 0 3px rgba(62,155,106,.18)}
.live-status.off i{background:#C58B3A}
.live-status.notes i{background:var(--lilac);box-shadow:0 0 0 3px rgba(182,163,221,.25)}
.source.notes i{width:6px;height:6px;border-radius:50%;background:var(--lilac)}

/* ---------- Loading ---------- */
.thinking{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.thinking .thumb{width:132px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-card);rotate:-3deg}
.thinking .l2{font-size:44px;line-height:1}
.steps{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.steps li.on{color:var(--ink)}
.steps li.done{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}

/* ---------- Matches ---------- */
.insp-head{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;margin-bottom:6px}
.insp-head .photo{border-radius:12px;box-shadow:var(--shadow-card);rotate:-2deg}
.source{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:5px 9px;border-radius:var(--pill);background:#fff;box-shadow:inset 0 0 0 1px rgba(23,22,24,.14)}
.source.live i{width:6px;height:6px;border-radius:50%;background:#3E9B6A}
.source.demo i{width:6px;height:6px;border-radius:50%;background:var(--rose)}
.m-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-card);padding:14px;display:grid;gap:14px}
.m-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.m-top .photo{border-radius:12px}
.m-title{font-size:18px;font-weight:500;line-height:1.25;margin:2px 0 6px}
.strength{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:var(--pill)}
.strength.s-strong{background:#F9E3EE;color:#8E1F52}
.strength.s-good{background:#EFEAF8;color:#4E3C80}
.strength.s-loose{background:#F2F0EE;color:#5E5A55}
.m-why{font-size:14px;line-height:1.5;margin:8px 0 0}
.tip{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--tint);border-radius:12px;padding:12px;font-size:14px;line-height:1.45}
.tip b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:16px}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save-btn[aria-pressed="true"]{background:#FBEAF1;color:var(--crimson);box-shadow:inset 0 0 0 1px rgba(176,26,69,.25)}
.save-btn[aria-pressed="true"] svg{fill:currentColor}
.weak{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0}

/* ---------- Saved ---------- */
.s-list{display:grid;gap:14px}
.s-item{appearance:none;border:0;background:#fff;border-radius:18px;box-shadow:var(--shadow-card);padding:10px;display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;text-align:left;width:100%}
.s-item .pair{position:relative;height:112px}
.s-item .pair .a{position:absolute;inset:0 14px 0 0;border-radius:10px;overflow:hidden}
.s-item .pair .b{position:absolute;right:0;bottom:-2px;width:40px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 2px #fff,0 4px 10px rgba(0,0,0,.15);rotate:6deg}
.s-item .pair img{width:100%;height:100%;object-fit:cover}
.s-item .pair .b img{aspect-ratio:3/4}
.s-item .t{font-size:16px;font-weight:500;line-height:1.25}
.s-item .d{font-size:13px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Empty states ---------- */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px 8px}
.empty .l1{font-size:22px}.empty .l2{font-size:44px;line-height:1}
.empty p{max-width:290px}
.ghosts{display:flex;gap:10px;margin-bottom:14px}
.ghosts span{width:58px;aspect-ratio:3/4;border-radius:10px;background:#fff;box-shadow:var(--shadow-card)}
.ghosts span:nth-child(1){rotate:-7deg}.ghosts span:nth-child(3){rotate:7deg}
.ghosts span:nth-child(2){translate:0 -6px;background:linear-gradient(#fff,#fff) padding-box, conic-gradient(from 0deg,#f4d2e3,#e3dbf3,#f4d2e3) border-box;border:6px solid transparent}

/* ---------- Dialog + toast ---------- */
dialog{border:0;border-radius:22px;padding:22px;width:min(92vw,380px);box-shadow:0 30px 80px rgba(20,0,20,.3);color:var(--text)}
dialog::backdrop{background:rgba(24,12,24,.35);backdrop-filter:blur(2px)}
dialog h2{font-size:20px;font-weight:500;margin:0 0 8px}
dialog p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);box-shadow:0 10px 30px rgba(0,0,0,.18);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--pill);font-size:14px;opacity:0;pointer-events:none;transition:.25s ease;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}


@media (max-width:360px){
  :root{--pad:18px}
  .m-top{grid-template-columns:100px 1fr}
  .collage .polaroid{width:84px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* =====================================================================
   Deja — illustrated flat-lay renderer for the sample demo.
   Draws garments on canvas so the demo never depends on the network.
   ===================================================================== */
const Art = (() => {
  // Each garment: unit box width 100, height H; `body` fill path, `lines` detail paths.
  const G = {
    tee: { H:100, body:"M30 6 L41 2 Q50 10 59 2 L70 6 L94 22 L84 40 L72 33 L73 98 L27 98 L28 33 L16 40 L6 22 Z",
      lines:["M41 2 Q50 12 59 2","M28 92 L73 92","M16 40 L6 22","M72 33 L72 40"] },
    longsleeve: { H:100, body:"M31 5 L41 2 Q50 9 59 2 L69 5 Q82 9 86 24 L99 86 L86 90 L74 42 L74 98 L26 98 L26 42 L14 90 L1 86 L14 24 Q18 9 31 5 Z",
      lines:["M41 2 Q50 11 59 2","M26 92 L74 92","M88 84 L98 81","M12 84 L2 81"] },
    shirt: { H:100, body:"M31 5 L41 2 Q50 6 59 2 L69 5 Q82 9 86 24 L99 86 L86 90 L74 42 L74 98 L26 98 L26 42 L14 90 L1 86 L14 24 Q18 9 31 5 Z",
      lines:["M41 2 L46 16 L50 10 L54 16 L59 2","M50 10 L50 98","M88 84 L98 81","M12 84 L2 81","M30 30 L40 30"], dots:[[50,26],[50,42],[50,58],[50,74],[50,90]] },
    cardigan: { H:100, body:"M31 5 L41 2 Q50 4 59 2 L69 5 Q82 9 86 24 L99 86 L86 90 L74 42 L74 98 L26 98 L26 42 L14 90 L1 86 L14 24 Q18 9 31 5 Z",
      lines:["M41 2 L50 34 L59 2","M50 34 L50 98","M26 92 L74 92","M88 84 L98 81","M12 84 L2 81"], dots:[[50,46],[50,60],[50,74],[50,88]] },
    blazer: { H:112, body:"M30 4 L42 1 L50 30 L58 1 L70 4 Q84 9 88 26 L99 100 L86 103 L76 46 L77 110 L23 110 L24 46 L14 103 L1 100 L12 26 Q16 9 30 4 Z",
      lines:["M42 1 L35 22 L45 28 L50 58","M58 1 L65 22 L55 28 L50 58","M50 58 L50 110","M30 80 L44 80","M56 80 L70 80","M66 36 L73 36"], dots:[[50,68],[50,84]] },
    coat: { H:140, body:"M30 4 L42 1 L50 30 L58 1 L70 4 Q84 9 88 26 L99 116 L86 119 L76 46 L79 138 L21 138 L24 46 L14 119 L1 116 L12 26 Q16 9 30 4 Z",
      lines:["M42 1 L33 24 L45 30 L50 60","M58 1 L67 24 L55 30 L50 60","M50 60 L50 138","M24 72 L76 72","M24 78 L76 78","M28 96 L42 96","M58 96 L72 96"], dots:[[44,64],[56,64],[44,88],[56,88]] },
    leather: { H:90, body:"M28 6 L42 2 L50 12 L58 2 L72 6 Q86 11 88 26 L99 84 L86 87 L76 40 L77 88 L23 88 L24 40 L14 87 L1 84 L12 26 Q14 11 28 6 Z",
      lines:["M42 2 L31 20 L45 27","M58 2 L68 17 L55 23","M45 14 L58 88","M24 80 L77 80","M30 46 L42 44","M62 52 L72 50"], collar:true },
    cami: { H:80, body:"M28 0 L32 0 L35 18 Q50 27 65 18 L68 0 L72 0 L73 22 Q77 50 75 78 L25 78 Q23 50 27 22 Z",
      lines:["M35 18 Q50 27 65 18","M35 34 L65 34","M38 48 L62 48","M40 62 L60 62"], bows:[[50,34],[50,48],[50,62]] },
    jeans: { H:130, body:"M20 2 L80 2 L84 128 L58 128 L50 38 L42 128 L16 128 Z",
      lines:["M20 9 L80 9","M50 9 L50 36","M23 12 Q30 22 36 12","M77 12 Q70 22 64 12","M17 120 L42 120","M58 120 L83 120"] },
    trousers: { H:130, body:"M22 2 L78 2 L94 128 L56 128 L50 40 L44 128 L6 128 Z",
      lines:["M22 9 L78 9","M50 9 L50 34","M32 12 L24 128","M68 12 L76 128"] },
    miniskirt: { H:62, body:"M28 2 L72 2 L86 60 L14 60 Z", lines:["M28 8 L72 8"] },
    midiskirt: { H:100, body:"M30 2 L70 2 L90 98 L10 98 Z", lines:["M30 8 L70 8"] },
    pleated: { H:100, body:"M30 2 L70 2 L92 98 L8 98 Z", lines:["M30 8 L70 8","M36 8 L24 98","M42 8 L40 98","M50 8 L50 98","M58 8 L60 98","M64 8 L76 98"] },
    slip: { H:150, body:"M35 0 L38 0 L41 22 Q50 30 59 22 L62 0 L65 0 L68 34 Q71 52 68 64 L86 148 L14 148 L32 64 Q29 52 32 34 Z",
      lines:["M41 22 Q50 30 59 22","M32 64 Q50 70 68 64"] },
    tote: { H:100, body:"M10 36 L90 36 L84 98 L16 98 Z", handle:"M30 36 Q30 6 50 6 Q70 6 70 36", lines:["M12 44 L88 44"] },
    minibag: { H:70, body:"M8 26 Q8 18 16 18 L84 18 Q92 18 92 26 L92 62 Q92 68 86 68 L14 68 Q8 68 8 62 Z", handle:"M16 20 Q50 -18 84 20", lines:["M8 26 L50 46 L92 26"], dots:[[50,46]] },
    // shoes (single, pair drawn by renderer)
    flat: { H:50, body:"M4 40 Q3 28 14 27 Q28 26 40 31 Q58 37 76 29 Q90 25 96 36 Q99 46 86 46 L12 46 Q4 46 4 40 Z", lines:["M14 29 Q40 38 76 30"], bowAt:[70,32], sole:"M8 45 L92 45" },
    loafer: { H:50, body:"M4 42 Q3 24 16 22 L40 20 Q52 19 62 23 Q80 23 92 32 Q99 39 96 46 L6 46 Q4 46 4 42 Z", lines:["M44 25 L72 28","M40 20 Q44 30 62 23"], sole:"M6 45 L95 45" },
    sneaker: { H:50, body:"M4 36 Q4 20 16 16 L44 10 Q52 22 66 22 L82 24 Q96 28 96 40 L96 46 L4 46 Z", sole:"M5 43 L95 43", lines:["M4 39 L96 39","M46 14 L52 22","M40 15 L46 23","M34 17 L40 24","M60 30 L78 30"] },
    heel: { H:50, body:"M2 44 Q6 30 24 28 Q46 26 62 16 Q76 8 90 8 L94 12 L86 22 L84 46 L78 46 L76 28 Q56 44 30 46 Z", lines:["M24 30 Q40 34 60 22"], sole:"M4 45 Q40 46 76 30" },
    boot: { H:80, body:"M20 2 L56 2 L58 46 Q80 50 94 60 Q98 72 86 76 L14 76 L12 62 Q18 40 20 2 Z", lines:["M20 8 L56 8","M50 2 L52 44"], sole:"M13 74 L90 74" },
    sandal: { H:50, body:"M6 38 Q6 32 18 32 L84 30 Q96 32 96 38 L96 44 L6 44 Z", straps:["M28 32 Q40 8 60 30","M50 31 Q62 14 78 30"] },
  };
  const SHOES = new Set(["flat","loafer","sneaker","heel","boot","sandal"]);

  const hex = h => { h=h.replace("#",""); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
  const shade = (h, a) => { const c = hex(h).map(v => Math.max(0,Math.min(255, Math.round(a<0? v*(1+a) : v+(255-v)*a)))); return `rgb(${c[0]},${c[1]},${c[2]})`; };
  const lum = h => { const [r,g,b]=hex(h); return (0.299*r+0.587*g+0.114*b)/255; };

  function pattern(ctx, it, W, H) {
    const p = it.pattern; if (!p) return;
    ctx.save();
    if (p === "stripe") { ctx.fillStyle = it.stripe || "#1F2A44"; const gap = it.gap || 9; for (let y = 10; y < H; y += gap) ctx.fillRect(-10, y, W+20, gap*0.42); }
    if (p === "denim") {
      ctx.globalAlpha = .13; ctx.strokeStyle = "#fff"; ctx.lineWidth = .6;
      for (let i = -H; i < W+H; i += 2.2) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+H*.5,H); ctx.stroke(); }
      ctx.globalAlpha = .22; const g = ctx.createRadialGradient(W*.33,H*.45,2,W*.33,H*.45,W*.28); g.addColorStop(0,"#fff"); g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H); const g2 = ctx.createRadialGradient(W*.67,H*.45,2,W*.67,H*.45,W*.28); g2.addColorStop(0,"#fff"); g2.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
    }
    if (p === "rib") { ctx.globalAlpha = .13; ctx.strokeStyle = "#000"; ctx.lineWidth = 1; for (let x = 3; x < W; x += 3.4) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); } }
    if (p === "satin") { const g = ctx.createLinearGradient(0,0,W,H); [[0,.0],[.28,.38],[.36,.05],[.6,.3],[.7,0],[1,.18]].forEach(([s,a])=>g.addColorStop(s,`rgba(255,255,255,${a})`)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    if (p === "leather") { const g = ctx.createLinearGradient(0,0,W,H*.7); [[0,0],[.3,.16],[.42,0],[.7,.1],[1,0]].forEach(([s,a])=>g.addColorStop(s,`rgba(255,255,255,${a})`)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    if (p === "linen") { ctx.globalAlpha=.07; ctx.strokeStyle="#6b5a3a"; ctx.lineWidth=.5; for (let y=0;y<H;y+=2.5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+Math.sin(y)*.6);ctx.stroke();} }
    if (p === "straw") { ctx.globalAlpha=.25; ctx.strokeStyle=shade(it.color,-.25); ctx.lineWidth=1; for (let y=0;y<H;y+=4){ for (let x=(y/4)%2?0:4;x<W;x+=8){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+4,y+4);ctx.stroke();} } }
    ctx.restore();
  }

  function drawOne(ctx, it, ox, oy, sx, sy, W, H, flip) {
    const g = G[it.kind], dark = lum(it.color) < .28;
    const body = new Path2D(g.body);
    ctx.save();
    ctx.translate(ox, oy);
    if (flip) { ctx.translate(100*sx, 0); ctx.scale(-1, 1); }
    ctx.scale(sx, sy);
    // soft cast shadow (flat-lay)
    ctx.save(); ctx.shadowColor = "rgba(70,40,50,.22)"; ctx.shadowBlur = 22; ctx.shadowOffsetY = 10;
    ctx.fillStyle = it.color; ctx.fill(body); ctx.restore();
    if (g.handle) { ctx.save(); ctx.lineWidth = (it.kind==="minibag"?1.4:4.5)/1; ctx.strokeStyle = it.kind==="minibag" ? (it.hardware||"#C9A55A") : shade(it.color,-.18); ctx.lineCap="round"; ctx.shadowColor="rgba(70,40,50,.2)"; ctx.shadowBlur=8; ctx.shadowOffsetY=4; ctx.stroke(new Path2D(g.handle)); ctx.restore(); }
    if (g.straps) { ctx.save(); ctx.lineWidth = 3.4; ctx.lineCap="round"; ctx.strokeStyle = shade(it.color,-.12); g.straps.forEach(s=>ctx.stroke(new Path2D(s))); ctx.restore(); }
    // fabric pattern + dimensional shading, clipped to garment
    ctx.save(); ctx.clip(body);
    pattern(ctx, it, 100, g.H);
    const sh = ctx.createLinearGradient(0, 0, 100, g.H);
    sh.addColorStop(0, "rgba(255,255,255,.14)"); sh.addColorStop(.55, "rgba(255,255,255,0)"); sh.addColorStop(1, "rgba(0,0,0,.10)");
    ctx.fillStyle = sh; ctx.fillRect(0, 0, 100, g.H);
    ctx.restore();
    // outline + construction lines
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = dark ? "rgba(255,255,255,.16)" : shade(it.color, -.28);
    ctx.lineWidth = 0.9; ctx.stroke(body);
    ctx.strokeStyle = dark ? "rgba(255,255,255,.22)" : shade(it.color, -.2);
    ctx.lineWidth = 0.7;
    (g.lines||[]).forEach(l => ctx.stroke(new Path2D(l)));
    if (it.kind==="jeans" || it.kind==="trousers") { ctx.save(); ctx.setLineDash([1.4,1.2]); ctx.strokeStyle = it.pattern==="denim" ? "rgba(214,160,80,.8)" : ctx.strokeStyle; ctx.lineWidth=.5; ctx.stroke(new Path2D("M22 12 L78 12")); ctx.restore(); }
    (g.dots||[]).forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fillStyle = it.button || (dark ? "#CFC6B6" : shade(it.color,-.35)); ctx.fill(); });
    (g.bows||[]).forEach(([x,y]) => { ctx.fillStyle = it.accent || "#1A1A1A"; ctx.beginPath(); ctx.ellipse(x-3,y,3,1.6,-.3,0,Math.PI*2); ctx.ellipse(x+3,y,3,1.6,.3,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=it.accent||"#1A1A1A"; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-2,y+7); ctx.moveTo(x,y); ctx.lineTo(x+2,y+7); ctx.stroke(); });
    if (g.bowAt) { const [x,y]=g.bowAt; ctx.fillStyle = shade(it.color, dark?.35:-.3); ctx.beginPath(); ctx.ellipse(x-2.6,y,2.6,1.4,0,0,Math.PI*2); ctx.ellipse(x+2.6,y,2.6,1.4,0,0,Math.PI*2); ctx.fill(); }
    if (g.collar && it.shearling) { ctx.save(); ctx.fillStyle = it.shearling; ctx.shadowColor="rgba(0,0,0,.18)"; ctx.shadowBlur=3; ctx.fill(new Path2D("M28 6 L42 2 L50 12 L58 2 L72 6 L68 18 L56 24 L50 14 L44 27 L30 21 Z")); ctx.restore(); }
    if (g.sole) { ctx.save(); ctx.strokeStyle = it.sole || (dark ? "#050505" : shade(it.color,-.32)); ctx.lineWidth = 2.4; ctx.stroke(new Path2D(g.sole)); ctx.restore(); }
    ctx.restore();
  }

  function drawItem(ctx, it) {
    const g = G[it.kind];
    const sx = it.w / 100, sy = it.h / g.H;
    ctx.save();
    ctx.translate(it.x + it.w/2, it.y + it.h/2);
    ctx.rotate((it.rot||0) * Math.PI/180);
    ctx.translate(-it.w/2, -it.h/2);
    if (SHOES.has(it.kind)) {
      const k = sx*.74;
      drawOne(ctx, it, 0, 0, k, k, 100, g.H, false);
      drawOne(ctx, it, it.w*.34, g.H*k*.62, k, k, 100, g.H, false);
    } else drawOne(ctx, it, 0, 0, sx, sy, 100, g.H, it.flip);
    ctx.restore();
  }

  function ground(ctx, W, H, bg) {
    const base = bg.color;
    ctx.fillStyle = base; ctx.fillRect(0,0,W,H);
    if (bg.light) { const g = ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,"rgba(255,248,235,.55)"); g.addColorStop(.45,"rgba(255,248,235,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    if (bg.floor) { ctx.globalAlpha=.08; ctx.strokeStyle="#000"; for(let x=0;x<W;x+=W/5){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+40,H);ctx.stroke();} ctx.globalAlpha=1; }
    // paper grain so it reads like a photo, not a vector
    const img = ctx.getImageData(0,0,W,H), d = img.data;
    let seed = 7; const rnd = () => ((seed = (seed*16807) % 2147483647) / 2147483647);
    for (let i=0;i<d.length;i+=4){ const n=(rnd()-.5)*(bg.grain||9); d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
    ctx.putImageData(img,0,0);
    const v = ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.8); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1, bg.vignette || "rgba(60,30,40,.12)");
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }

  const cache = new Map();
  function render(key, spec, W=600, H=800, type="image/jpeg") {
    if (cache.has(key)) return cache.get(key);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    ground(ctx, W, H, spec.bg);
    spec.items.forEach(it => drawItem(ctx, it));
    const url = c.toDataURL(type, .88);
    cache.set(key, url);
    return url;
  }
  return { render, G };
})();

const DB = (() => {
  let db = null, mem = null;
  const STORES = ["outfits", "inspirations", "saved"];
  async function open() {
    try {
      if (!("indexedDB" in window)) throw 0;
      db = await Promise.race([
        new Promise((res, rej) => {
          const r = indexedDB.open("deja", 1);
          r.onupgradeneeded = () => { const d = r.result; STORES.forEach(n => d.objectStoreNames.contains(n) || d.createObjectStore(n, { keyPath: "id" })); d.objectStoreNames.contains("kv") || d.createObjectStore("kv"); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
        }),
        sleep(4000).then(() => { throw new Error("timeout"); }),
      ]);
      try { navigator.storage?.persist?.(); } catch {}
      return true;
    } catch {
      db = null; mem = { outfits:new Map(), inspirations:new Map(), saved:new Map(), kv:new Map() };
      return false;
    }
  }
  const req = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode), r = fn(t.objectStore(store));
    t.oncomplete = () => res(r?.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("aborted"));
  });
  return {
    open,
    get persistent() { return !!db; },
    all: s => mem ? Promise.resolve([...mem[s].values()]) : req(s, "readonly", st => st.getAll()),
    put: (s, v) => mem ? (mem[s].set(v.id, v), Promise.resolve()) : req(s, "readwrite", st => st.put(v)),
    del: (s, k) => mem ? (mem[s].delete(k), Promise.resolve()) : req(s, "readwrite", st => st.delete(k)),
    kvGet: k => mem ? Promise.resolve(mem.kv.get(k)) : req("kv", "readonly", st => st.get(k)),
    kvSet: (k, v) => mem ? (mem.kv.set(k, v), Promise.resolve()) : req("kv", "readwrite", st => st.put(v, k)),
    kvDel: k => mem ? (mem.kv.delete(k), Promise.resolve()) : req("kv", "readwrite", st => st.delete(k)),

  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) throw new UploadError("type", file.type ? "Not a supported image" : "Unknown file type");
  if (file.size > 40e6) throw new UploadError("size", "Over 40 MB — try a smaller photo");

  const set = (status, reason = "") => { st.status = status; st.reason = reason; listeners.forEach(f => f()); };
  const PERMANENT = new Set(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable","session_expired"]);

  async function init() {
    try {
      const res = await fetch('/api/gemini');
      const config = await res.json();
      if (!config.configured) return set("unavailable", "setup");
      sample = { async json(prompt, options = {}) {
        const images = await Promise.all((options.images || []).map(blob => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ mimeType: blob.type, data: String(reader.result).split(',')[1] });
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        })));
        const response = await fetch('/api/gemini', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({prompt, images}), signal: options.signal
        });
        const result = await response.json();
        if (!response.ok) { const error = new Error(result.error || 'Image analysis failed'); error.code = result.code; throw error; }
        return result;
      }};
      set("ready");
    } catch { set("unavailable", "setup"); }
  }

  function explain(code) {
    switch (code) {
      case "not_granted": return "Claude access wasn't allowed for this page. Reload to be asked again.";
      case "sampling_disabled": return "Claude isn't available on this account.";
      case "session_expired": return "Your Claude session expired — sign in again, then reload.";
      case "rate_limited": return "Too many requests right now. Wait a minute and try again.";
      case "image_rejected": return "That image couldn't be read. Try a different JPG or PNG.";
      case "refused": return "Claude declined to analyse this image. Try a different one.";
      case "invalid_json": case "empty_completion": return "The answer came back incomplete. Try again.";
      case "cancelled": return "Stopped.";
      default: return "Live analysis hit a problem. Try again in a moment.";
    }

  function fail(e) {
    const code = e?.code || "upstream_error";
    if (PERMANENT.has(code)) set("unavailable", code);
    const err = new Error(e?.message || explain(code)); err.code = code; return err;
  }

  const str = (v, n = 240) => typeof v === "string" ? v.trim().slice(0, n) : "";
  const arr = (v, n = 6, m = 40) => Array.isArray(v) ? v.map(x => str(x, m)).filter(Boolean).slice(0, n) : [];

  async function analyzeOutfit(blob) {
    if (!sample) throw fail({ code: "capability_disabled" });
    const prompt = `You are the wardrobe reader for Deja, an outfit app. The attached image is a photo of an outfit the user owns — often a mirror selfie or a flat lay.
Describe ONLY clothing, shoes and accessories that are clearly visible. Do not guess brands. Do not describe the person's face, body or identity.
Reply with only a JSON object:
{"is_outfit": true, "name": "2-4 word outfit name", "description": "1-2 sentences naming each visible garment with its colour", "palette": ["colour words"], "silhouette": "short phrase", "layering": "short phrase", "formality": "casual | smart casual | business | evening", "occasions": ["any of: Everyday, Work, Date night, Going out"], "tags": ["3 to 5 short style tags"]}
If the image does not show wearable clothing, reply {"is_outfit": false}.`;
    let r;
    try { r = await sample.json(prompt, { images: [blob], modelTier: "quick" }); }
    catch (e) { throw fail(e); }
    if (!r || typeof r !== "object") throw fail({ code: "invalid_json" });
    if (r.is_outfit === false) return { isOutfit: false };
    const a = {
      isOutfit: true, name: str(r.name, 40), description: str(r.description, 320),
      palette: arr(r.palette), silhouette: str(r.silhouette, 90), layering: str(r.layering, 90),
      formality: str(r.formality, 30), occasions: arr(r.occasions, 4, 20).filter(o => OCCASIONS.includes(o)),
      tags: arr(r.tags, 5, 22),
    };
    if (!a.description) throw fail({ code: "invalid_json" });
    return a;
  }

  function shape(r, list, k) {
    if (!r || typeof r !== "object") throw fail({ code: "invalid_json" });
    const ids = new Set(list.map(o => o.id)), seen = new Set();
    const raw = Array.isArray(r.matches) ? r.matches : [];
    const matches = raw
      .filter(m => m && ids.has(String(m.id)) && !seen.has(String(m.id)) && seen.add(String(m.id)))
      .map(m => ({ id: String(m.id), score: Math.max(0, Math.min(100, Math.round(Number(m.score) || 0))), why: str(m.why, 360), tip: str(m.tip, 260) }))
      .filter(m => m.why)
      .slice(0, k);
    return {
      isOutfit: r.inspiration?.is_outfit !== false,
      summary: str(r.inspiration?.summary, 140),
      note: str(r.note, 220),
      matches, dropped: Math.max(0, raw.length - matches.length),
    };
  }

  const RULES = `Rules:
- Use ONLY ids from the wardrobe list. Never invent outfits or garments.
- "why": 1-2 sentences naming concrete shared qualities, and the main real difference if there is one.
- "tip": ONE practical styling tip using only garments already described in THAT outfit (tuck, roll, cuff, button, sleeve push, how to carry the bag). Never suggest buying, borrowing or adding anything.
- "score": 0-100 similarity. Be honest — under 45 is a loose match, and "why" must say so plainly.`;
  const SHAPE = `Reply with only a JSON object:
{"inspiration": {"is_outfit": true, "summary": "one short line describing the inspiration look"}, "matches": [{"id": "...", "score": 0, "why": "...", "tip": "..."}], "note": "one sentence only if every match is weak, else empty"}`;

  /* Text-only matching: used when this view cannot send images. Works from the
     user's OWN written notes — never implies a photo was looked at. */
  async function matchText(text, list, occasion, signal) {
    if (!sample) throw fail({ code: "capability_disabled" });
    const k = Math.min(3, list.length);
    const wardrobe = list.map(o => ({ id: o.id, name: o.name, tags: o.tags || [], description: o.note || o.analysis?.description || "" }));
    const prompt = `You are Deja, a stylist who only works with clothes the user already owns.
You are working from WRITTEN DESCRIPTIONS, not photographs. You have not seen any image. Never say or imply that you looked at a photo.

The user describes the look they want to recreate as:
"${text}"

${occasion ? `They are dressing for: ${occasion}. Weigh formality and mood for that occasion.` : "No occasion was chosen."}

Below is their wardrobe — complete outfits they own, described in their own words.
Rank up to ${k} of them that best capture the described look (colour, silhouette, layering, formality).
${RULES}
- Judge only from the written descriptions. Where a description is thin, say so in "why" rather than guessing.

Wardrobe:
${JSON.stringify(wardrobe)}

${SHAPE}`;
    let r;
    try { r = await sample.json(prompt, { signal }); } catch (e) { throw fail(e); }
    return shape(r, list, k);
  }

  async function match(inspBlob, list, occasion, signal) {
    if (!sample) throw fail({ code: "capability_disabled" });
    const k = Math.min(3, list.length);
    const wardrobe = list.map(o => ({ id: o.id, name: o.name, tags: o.tags, ...o.analysis }));
    wardrobe.forEach(w => { delete w.isOutfit; delete w.name_suggested; });
    const prompt = `You are Deja, a stylist who only works with clothes the user already owns.
The attached image is an INSPIRATION outfit (for example a Pinterest screenshot). Below is the user's wardrobe: complete outfits they own, each with an id and a description of what is visible in their own photo.
${occasion ? `They are dressing for: ${occasion}. Weigh formality and mood for that occasion.` : "No occasion was chosen."}

Rank up to ${k} wardrobe outfits that best capture the inspiration's look — colour palette, silhouette, layering and formality.
Rules:
- Use ONLY ids from the wardrobe list. Never invent outfits or garments.
- "why": 1-2 sentences naming concrete shared qualities, and the main real difference if there is one.
- "tip": ONE practical styling tip using only garments already visible in THAT outfit (tuck, roll, cuff, button, sleeve push, how to carry the bag). Never suggest buying, borrowing or adding anything.
- "score": 0-100 visual similarity. Be honest — under 45 is a loose match, and "why" must say so plainly.
- If the image shows no outfit, set "is_outfit" to false and return an empty "matches" list.

Wardrobe:
${JSON.stringify(wardrobe)}

Reply with only a JSON object:
{"inspiration": {"is_outfit": true, "summary": "one short line describing the inspiration look"}, "matches": [{"id": "...", "score": 0, "why": "...", "tip": "..."}], "note": "one sentence only if every match is weak, else empty"}`;
    let r;
    try { r = await sample.json(prompt, { images: [inspBlob], signal }); }
    catch (e) { throw fail(e); }
    return shape(r, list, k);
  }

  return { init, get status() { return st.status; }, get reason() { return st.reason; }, on: f => listeners.add(f), analyzeOutfit, match, matchText };
})();

/* ---------- Analysis queue: each wardrobe photo is analysed once ---------- */
const Queue = (() => {
  let running = false;
  async function run() {
    if (running || AI.status !== "ready") return;
    running = true;
    try {
      for (;;) {
        if (AI.status !== "ready") break;
        const o = State.mine.find(x => x.analysisStatus === "none" && x.queued);
        if (!o) break;
        o.analysisStatus = "pending"; o.queued = false; refresh();
        try {
          const a = await AI.analyzeOutfit(o.blob);
          if (!a.isOutfit) { o.analysisStatus = "not_outfit"; o.analysis = null; }
          else {
            o.analysis = a; o.analysisStatus = "done"; o.analysisError = "";
            if (!o.nameEdited && a.name) o.name = a.name;
            if (!o.tagsEdited && a.tags.length) o.tags = a.tags;
          }
        } catch (e) {
          o.analysisStatus = e.code && ["not_granted","sampling_disabled","capability_disabled","session_expired"].includes(e.code) ? "none" : "failed";
          o.analysisError = e.message;
        }
        if (State.mine.includes(o)) await saveOutfit(o).catch(() => {});
        refresh();
      }
    } finally { running = false; }
  }
  function add(list) { list.forEach(o => { if (o.analysisStatus === "none" || o.analysisStatus === "failed") { o.analysisStatus = "none"; o.queued = true; } }); run(); }
  return { add, run, get busy() { return running; } };
})();

  const LABEL = { cropped:"cropped length", midi:"midi length", mini:"mini length", maxi:"long length", pleated:"pleats", highwaist:"high waist", tee:"T-shirt", flats:"flat shoes", knit:"knit", rib:"ribbed knit", highwaist:"high waist", aline:"A-line", stripes:"stripes", wide:"wide leg", straight:"straight line", check:"check", sparkle:"sparkle", evening:"evening mood", smart:"polished feel", casual:"easy, casual feel", minimal:"minimal feel", edgy:"edgy feel", feminine:"soft, feminine feel", french:"French feel", layered:"layering", tailored:"tailoring", oversized:"oversized shape", fitted:"fitted shape" };

function liveStatus() {
  const s = AI.status;
  if (s === "checking") return `<span class="live-status" role="status"><i></i>Checking live matching…</span>`;
  if (s === "ready") return `<span class="live-status on" role="status"><i></i>Live matching on</span>`;
  if (s === "text") return `<span class="live-status notes" role="status"><i></i>Matching from notes</span>`;
  return `<span class="live-status notes" role="status"><i></i>Matching on your words</span>`;
}
/* notes modes: "text" = Claude reads your words; "unavailable" = the on-device matcher does */
const isText = () => AI.status === "text" || AI.status === "unavailable";
const isLocal = () => AI.status === "unavailable";
const modeOf = r => r?.mode || (r?.demo ? "demo" : "live");
const SRC = { demo: ["demo", "Demo suggestions", "Demo suggestion"], live: ["live", "Live match", "Live match"], notes: ["notes", "Matched from notes", "Matched from notes"], local: ["notes", "Matched on your words", "Matched on your words"] };
function sourceTag(r, single) { const [cls, many, one] = SRC[modeOf(r)] || SRC.live; return `<span class="source ${cls}"><i></i>${single ? one : many}</span>`; }
const NOTES_CLAUDE = "This account can't send photos to Claude, so Deja matches on what you write rather than on the pictures.";
const NOTES_LOCAL = "Deja matches on what you write — a line about the look you want and a line about each outfit. It runs on this device; photos aren't analysed.";
Object.defineProperty(window, "NOTES_WHY", { get: () => isLocal() ? NOTES_LOCAL : NOTES_CLAUDE });
function needsNote(o) { return o.space !== "demo" && !o.note && !(o.analysis && o.analysisStatus === "done"); }
function aiUnavailableCopy() {
  const r = AI.reason;
  if (r === "not_granted") return "Claude access wasn't allowed for this page, so Deja can't read your photos. Reload the page to be asked again.";
  if (r === "images") return "This view can't send images to Claude, so Deja can't read your photos here.";
  if (r === "runtime") return "Live matching needs the Gemini connection. Your photos are still saved on this device.";
  return "Live matching is not connected. Add GEMINI_API_KEY in Vercel and redeploy; your photos are still saved.";
}

}

/* ---------- 9. Matches ---------- */
V.matches = () => {
  const r = State.result[State.space];
  if (!r) return V.style();
  const img = inspImg(r.insp);
  const valid = r.matches.map((m, i) => ({ ...m, i, o: findOutfit(m.id) })).filter(m => m.o);
  const allWeak = valid.length && valid.every(m => m.score < 55);
  const total = r.wardrobeSize ?? outfits().length;
  const head = sourceTag(r);
  const cards = valid.map(m => {
    const [cls, label] = strengthOf(m.score);
    const saved = isSaved({ ...m, insp: r.insp, text: r.text });
    return `<article class="m-card" aria-labelledby="m${m.i}">
      <div class="m-top">
        <button class="o-card" data-act="view-match" data-i="${m.i}" aria-label="View ${esc(m.o.name)}"><div class="photo"><img src="${outfitImg(m.o)}" alt=""></div></button>
        <div><span class="strength ${cls}">${label}</span><h2 class="m-title" id="m${m.i}">${esc(m.o.name)}</h2><p class="m-why">${esc(m.why)}</p></div>
      </div>
      ${m.tip ? `<div class="tip"><b>Tip</b><span>${esc(m.tip)}</span></div>` : ""}
      <div class="m-actions">
        <button class="btn btn-light btn-sm save-btn" data-act="toggle-save" data-i="${m.i}" aria-pressed="${!!saved}">${I.heart}${saved ? "Saved" : "Save look"}</button>
        <button class="btn btn-primary btn-sm" data-act="view-match" data-i="${m.i}">View outfit</button>
      </div></article>`;
  }).join("");
  let notes = "";
  if (!r.isOutfit) notes += `<div class="notice warn">${I.info}<div>Deja couldn't see an outfit in this inspiration image. Try a screenshot where the clothes are clearly visible.</div></div>`;
  else if (!valid.length) notes += `<div class="notice warn">${I.info}<div>No outfit in your wardrobe is close enough to recommend for this one${r.note ? ` — ${esc(r.note)}` : "."} Try another inspiration, or add more outfits.</div></div>`;
  else if (allWeak) notes += `<p class="weak"><b>Honest take:</b> nothing in your wardrobe is a close match for this look. ${valid.length > 1 ? "These are the nearest options" : "This is the nearest option"}${r.note ? ` — ${esc(r.note)}` : "."}</p>`;
  if (valid.length && valid.length < 3 && total < 3) notes += `<p class="weak">You have ${total} outfit${total > 1 ? "s" : ""} in your wardrobe, so Deja can show at most ${total}. Add more for more options.</p>`;
  return `
<section class="screen has-nav" aria-labelledby="h">
  <div class="glow top soft"></div>

/* ---------- 10. Look detail (from a match or a saved look) ---------- */
function lookFrom(kind, key) {
  if (kind === "m") { const r = State.result[State.space]; const m = r?.matches[+key];
    return m ? { ...m, insp: r.insp, demo: r.demo, mode: modeOf(r), text: r.text, summary: r.summary, occasion: r.occasion, space: State.space, fromMatch: +key } : null; }
  const s = State.saved.find(x => x.id === key) || Unsaved.get(key);
  return s ? { ...s, id: s.outfitId, savedId: s.id } : null;
}
V.look = (kind, key) => {
  const L = lookFrom(kind, key);
  if (!L) return V.missing("This look isn't available any more.", kind === "s" ? "saved" : "style");
  const o = findOutfit(L.id, L.space);
  const [cls, label] = strengthOf(L.score);
  const saved = isSaved(L);
  return `
<section class="screen has-nav" aria-labelledby="h">
  <div class="back-row"><button class="icon-btn" data-act="back" aria-label="Back">${I.back}</button>
    ${sourceTag(L, true)}<span style="width:44px"></span></div>
  <div class="stack">
    ${o ? `<div class="detail-photo"><img src="${outfitImg(o)}" alt="Outfit photo: ${esc(o.name)}"></div>`
        : `<div class="notice warn">${I.info}<div>The outfit for this look was deleted from your wardrobe.</div></div>`}
    <div><span class="strength ${cls}">${label}</span>
      <h1 id="h" tabindex="-1" class="h-page" style="margin-top:10px">${esc(o?.name || L.name || "Saved look")}</h1></div>
    <div class="row" style="gap:12px">
      ${inspImg(L.insp) ? `<div class="photo" style="width:64px;flex:0 0 64px;border-radius:8px;box-shadow:var(--shadow-card)"><img src="${inspImg(L.insp)}" alt=""></div>` : ""}
      <div><span class="eyebrow">Inspired by</span><div style="font-size:15px">${esc(L.summary || inspName(L.insp))}</div>${L.occasion ? `<span class="chip quiet" style="margin-top:6px">${esc(L.occasion)}</span>` : ""}</div>
    </div>
    <div class="field"><label>Why it works</label><p class="prose">${esc(L.why)}</p></div>
    ${L.tip ? `<div class="tip"><b>Tip</b><span>${esc(L.tip)}</span></div>` : ""}
    <div class="split">
      <button class="btn btn-light save-btn" data-act="toggle-save-look" data-kind="${kind}" data-key="${esc(key)}" aria-pressed="${!!saved}">${I.heart}${saved ? "Saved" : "Save look"}</button>
      ${o ? `<button class="btn btn-primary" data-act="open-outfit" data-id="${esc(o.id)}" data-space="${L.space}">Edit outfit</button>` : `<button class="btn btn-primary" data-act="to-style">New look</button>`}
    </div>
  </div>
  ${nav(kind === "s" ? "saved" : "style")}
</section>`;
};

/* ---------- 11. Saved ---------- */
V.saved = () => {
  const list = State.saved.filter(s => s.space === State.space);
  if (!list.length) return `
<section class="screen has-nav" aria-labelledby="h">
  <div class="glow mid soft"></div>
  ${topbar()}
  <div class="empty">
    <div class="ghosts" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 id="h" tabindex="-1" style="margin:0;font-weight:400"><span class="l1">No saved looks</span><br><em class="s l2">yet</em></h1>
    <p class="lede">When a match feels right, tap “Save look” and it lands here.</p>
    <div class="cta-stack" style="max-width:300px;margin-top:10px"><button class="btn btn-primary" data-act="to-style">${I.spark}Find my next look</button></div>

  return `
<section class="screen has-nav" aria-labelledby="h">

  <div class="s-list">${list.map(s => { const o = findOutfit(s.outfitId, s.space); return `
    <button class="s-item" data-act="open-saved" data-id="${esc(s.id)}">
      <div class="pair"><div class="a">${o ? `<img src="${outfitImg(o)}" alt="">` : ""}</div>${inspImg(s.insp) ? `<div class="b"><img src="${inspImg(s.insp)}" alt=""></div>` : ""}</div>
      <div><div class="t">${esc(o?.name || "Deleted outfit")}</div><div class="d">${esc(s.why)}</div>
        <div class="row wrap" style="gap:6px;margin-top:8px"><span class="chip">${({ demo: "Demo", notes: "From notes", local: "Your words" })[modeOf(s)] || "Live"}</span>${s.occasion ? `<span class="chip quiet">${esc(s.occasion)}</span>` : ""}</div></div>
    </button>`; }).join("")}</div>
